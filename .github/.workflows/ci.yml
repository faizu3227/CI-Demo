name: CI Demo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Confirm CI ran
        run: |
          echo "Continuous Integration Pipeline Executed Successfully"
          ls -la